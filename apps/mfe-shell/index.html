<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autonomous MFE Host Shell</title>
    <style>
      :root {
        --bg-primary: #0a0d14;
        --bg-card: #131722;
        --border: #232936;
        --accent: #3b82f6;
        --accent-glow: rgba(59, 130, 246, 0.25);
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --text: #f3f4f6;
        --text-muted: #9ca3af;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background: var(--bg-primary);
        color: var(--text);
        padding: 24px;
        min-height: 100vh;
      }
      .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 24px;
      }
      .logo {
        font-weight: 700;
        font-size: 1.15rem;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .badge {
        font-size: 0.75rem;
        padding: 4px 8px;
        border-radius: 20px;
        background: rgba(16, 185, 129, 0.15);
        color: var(--success);
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
      }
      .btn {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .btn-danger {
        background: var(--danger);
      }
      .user-info {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.95rem;
      }
      .info-label {
        color: var(--text-muted);
      }
      .telemetry {
        font-family: monospace;
        font-size: 0.85rem;
        background: #080a0f;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        max-height: 220px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      <div class="logo">
        <span>⚡ Autonomous Micro-Frontend Shell</span>
        <span class="badge">Module Federation v5</span>
      </div>
      <div>
        <button id="btn-fetch" class="btn">Fetch via Orchestrated Gateway</button>
        <button id="btn-chaos" class="btn btn-danger">Simulate Upstream Drift</button>
      </div>
    </div>

    <div class="grid">
      <!-- Remote Micro-Frontend 1: User Profile Fragment -->
      <div class="card">
        <div class="card-header">
          <h3>👤 User Profile Micro-Frontend</h3>
          <span id="heal-indicator" class="badge">Awaiting Data</span>
        </div>
        <div class="user-info" id="user-display">
          <p style="color: var(--text-muted)">Click "Fetch via Orchestrated Gateway" to load profile.</p>
        </div>
      </div>

      <!-- Real-Time Orchestration Telemetry -->
      <div class="card">
        <div class="card-header">
          <h3>📡 Runtime Contract & Patch Telemetry</h3>
          <span class="badge" style="background: rgba(59, 130, 246, 0.15); color: var(--accent);">Live Stream</span>
        </div>
        <div class="telemetry" id="telemetry-log">
          [System Ready] Connected to Gateway at http://localhost:4000
        </div>
      </div>
    </div>

    <!-- Dynamic Webpack Module Federation Remote Patch Injector -->
    <script>
      const log = (msg) => {
        const el = document.getElementById('telemetry-log');
        const time = new Date().toLocaleTimeString();
        el.innerHTML = `[${time}] ${msg}\n` + el.innerHTML;
      };

      async function fetchUser() {
        log('Requesting User Profile from Gateway /api/v1/user-service/users/101...');
        try {
          const res = await fetch('http://localhost:4000/api/v1/user-service/users/101');
          const isHealed = res.headers.get('x-orchestrator-healed') === 'true';
          const data = await res.json();

          const indicator = document.getElementById('heal-indicator');
          if (isHealed) {
            indicator.innerText = '🛡️ Self-Healed by Agentic AI';
            indicator.style.color = '#10b981';
            indicator.style.background = 'rgba(16, 185, 129, 0.2)';
            log('⚡ Gateway Response received with X-Orchestrator-Healed: TRUE');
          } else {
            indicator.innerText = '✓ Direct Stable Contract';
            indicator.style.color = '#3b82f6';
            indicator.style.background = 'rgba(59, 130, 246, 0.2)';
            log('Response received: Valid baseline schema.');
          }

          // Micro-Frontend UI rendering contract expects `firstName`
          const display = document.getElementById('user-display');
          if (!data.firstName && data.first_name) {
            // Unhealed crash simulation
            display.innerHTML = `
              <div style="color: #ef4444; font-weight: bold;">
                ❌ Crash: TypeError: Cannot read properties of undefined (reading 'firstName')
              </div>
              <div style="color: var(--text-muted); font-size: 0.85rem; margin-top: 8px;">
                Raw payload received mutated key 'first_name'.
              </div>
            `;
            log('CRITICAL: Micro-Frontend threw uncaught render error!');
          } else {
            display.innerHTML = `
              <div class="info-row"><span class="info-label">ID:</span> <span>${data.id}</span></div>
              <div class="info-row"><span class="info-label">First Name:</span> <span style="font-weight:600; color:#60a5fa">${data.firstName}</span></div>
              <div class="info-row"><span class="info-label">Last Name:</span> <span>${data.lastName || data.last_name || ''}</span></div>
              <div class="info-row"><span class="info-label">Email:</span> <span>${data.email}</span></div>
              <div class="info-row"><span class="info-label">Role:</span> <span>${data.role}</span></div>
            `;
          }
        } catch (err) {
          log(`Error connecting to gateway: ${err.message}`);
        }
      }

      async function triggerChaos() {
        log('Injecting breaking API schema drift via POST /chaos/mutate...');
        try {
          const res = await fetch('http://localhost:3001/chaos/mutate', { method: 'POST' });
          const resData = await res.json();
          log(resData.message);
          setTimeout(fetchUser, 600);
        } catch (err) {
          log(`Chaos trigger failed: ${err.message}`);
        }
      }

      document.getElementById('btn-fetch').addEventListener('click', fetchUser);
      document.getElementById('btn-chaos').addEventListener('click', triggerChaos);

      // Auto-fetch on load
      fetchUser();
    </script>
  </body>
</html>
